# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket/injection states a delay that overrides the DB fact
stale_policy: FM-06            # superseded or not-yet-effective clause cited by the customer
clause_sum: FM-04              # "cộng cả hai khoản": sum clauses instead of taking the max
double_deduct: FM-05           # prior refund on the order: deduct before the host deducts again
sibling_refund: FM-07          # "gom đơn": money lands under a sibling claim of the same order
denied_ignored: FM-02          # expired / used-up approval: host denies, agent says resolved
reply_ledger_mismatch: FM-08   # approval caps below the quote: reply must state the ledger amount
cross_principal: FM-09         # another principal / impersonation asks for someone else's order
